<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)">

<meta name="description" content="每日晨报与重点关注提醒。">
<title>晨报 · 简报看板</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#182033; --muted:#758096; --soft:#99a1b1;
  --line:#e7eaf1; --violet:#7665df; --violet-soft:#eeebff;
  --red:#d95461; --amber:#d78822; --green:#189a73;
  --impact:#f7f8fc; --shadow:0 12px 34px rgba(36,48,84,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1220; --card:#171b2c; --ink:#e8ecf6; --muted:#97a0b5; --soft:#6f778c;
    --line:#252b40; --violet:#9c8cff; --violet-soft:#241f44;
    --red:#f0707d; --amber:#e0a04a; --green:#4fc79a;
    --impact:#1d2237; --shadow:0 12px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{
  min-height:100vh; color:var(--ink); background:var(--bg);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,#8a79f0,#5d59c8);z-index:50;transition:width .1s linear}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 56px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none}
.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#fff;font-weight:800;font-size:17px;
  background:linear-gradient(145deg,#8a79f0,#5d59c8);box-shadow:0 6px 16px rgba(108,95,213,.28)}
.brand b{display:block;font-size:15px;letter-spacing:.02em}
.brand small{display:block;color:var(--soft);font-size:9px;font-weight:600;letter-spacing:.18em}
.status{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(53,184,139,.12)}
.status.off i{background:var(--amber);box-shadow:0 0 0 4px rgba(215,136,34,.12)}

/* hero */
.hero{padding:34px 0 24px}
.hero h1{margin:0;font-size:clamp(30px,6vw,40px);line-height:1.2;letter-spacing:-.04em}
.hero h1 span{color:#edb154;font-size:.5em;vertical-align:top;margin-left:6px}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{flex:1 1 120px;min-width:110px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.stat span{display:block;color:var(--soft);font-size:11px}
.stat b{display:block;margin-top:2px;font-size:19px;letter-spacing:-.02em}
.stat b.red{color:var(--red)} .stat b.amber{color:var(--amber)}

/* controls */
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:9px;padding:8px 12px;color:var(--muted);background:transparent;font-size:13px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--violet);background:var(--violet-soft);font-weight:700}
.tab em{font-style:normal;opacity:.6;margin-left:4px;font-size:11px}
.search{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;outline:none}
.search:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(118,101,223,.12)}

/* watch */
.watch{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:12px 0 0}
.watch-label{color:var(--soft);font-size:11px;letter-spacing:.04em}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--card);color:var(--muted);font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--violet);color:var(--violet);background:var(--violet-soft);font-weight:600}
.chip b{font-weight:700;margin-left:3px}

/* feed */
.feed{display:grid;gap:12px;padding-top:16px}
.card{position:relative;overflow:hidden;padding:18px 20px 14px 22px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:var(--shadow);
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;cursor:pointer;outline:none}
.card:hover{transform:translateY(-2px);border-color:#d6cffa;box-shadow:0 18px 44px rgba(36,48,84,.10)}
.card:active{transform:scale(.996)}
.card:focus-visible{box-shadow:0 0 0 3px rgba(118,101,223,.4)}
.card::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--violet)}
.card[data-urgency="high"]::before{background:var(--red)}
.card[data-urgency="medium"]::before{background:var(--amber)}
.card[data-urgency="low"]::before{background:var(--green)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{min-height:22px;display:inline-flex;align-items:center;padding:3px 8px;border-radius:7px;background:var(--violet-soft);color:var(--violet);font-size:10px;font-weight:700}
.tag.u-high{color:var(--red);background:rgba(217,84,97,.11)}
.tag.u-medium{color:var(--amber);background:rgba(215,136,34,.12)}
.tag.u-low{color:var(--green);background:rgba(24,154,115,.11)}
.tag.hit{color:#0f7a5a;background:rgba(79,199,154,.14)}
.tag.new{color:#fff;background:var(--violet)}
.time{flex:none;color:var(--soft);font-size:11px}
.card h2{margin:0;font-size:17px;line-height:1.5;letter-spacing:-.02em}
.card p{margin:8px 0 0;color:var(--muted);font-size:13.5px;line-height:1.8}
.card p.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.impact{margin-top:11px;padding:9px 11px;border-radius:9px;background:var(--impact);color:var(--muted);font-size:12.5px;line-height:1.7}
.impact b{color:var(--ink);font-weight:600}
.next{margin:9px 0 0;color:var(--muted);font-size:12.5px;line-height:1.7}
.next b{color:var(--ink);font-weight:600}
.expand-row{margin-top:6px}
.expand{border:0;background:transparent;color:var(--violet);font-size:12px;font-weight:600;padding:0;cursor:pointer}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.src{color:var(--soft);font-size:11px}
.link{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--violet);font-size:12px;font-weight:600;text-decoration:none;background:var(--card);transition:.15s}
.link:hover{background:var(--violet-soft);border-color:#c8bffa}
mark{background:rgba(237,177,84,.35);color:inherit;border-radius:3px;padding:0 1px}

/* states */
.empty{margin-top:24px;padding:40px 22px;border:1px dashed var(--line);border-radius:15px;text-align:center;background:var(--card)}
.empty .ico{font-size:26px;color:var(--violet);opacity:.7}
.empty h3{margin:10px 0 6px;font-size:15px}
.empty p{margin:0;color:var(--muted);font-size:13px}
.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;color:var(--soft);font-size:11px}

@media (max-width:640px){
  .wrap{padding:0 14px 44px}
  .hero{padding:26px 0 18px}
  .card{padding:16px 16px 12px 18px}
  .card h2{font-size:16px}
  .stats{gap:8px}
  .stat{flex:1 1 30%;min-width:92px;padding:9px 10px}
  .stat b{font-size:17px}
  .foot{flex-direction:column;gap:4px}
}
</style>
</head>

    const needle = esc(t);
    if (!needle) return;
    const re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    out = out.replace(re, (m) => `<mark>${m}</mark>`);
  });
  return out;
}

const URG = { high: ["紧急", "u-high"], medium: ["关注", "u-medium"], low: ["参考", "u-low"] };
const KEY_OF = (it) => String(it.sourceUrl || it.title || "");

function renderCard(it) {
  const u = URG[it.urgency] || URG.low;
  const hit = it.hits && it.hits.length;
  const terms = hit ? it.hits : [];
  const url = safeUrl(it.sourceUrl);
  const key = KEY_OF(it);
  const open = S.expanded.has(key);
  const isNew = prevSeen && new Date(it.publishedAt || 0).getTime() > prevSeen;
  const longText = String(it.summary || "").length > 78;
  return `<article class="card" data-urgency="${esc(it.urgency || "low")}" data-url="${esc(url)}" data-key="${esc(key)}"
      tabindex="0" role="link" aria-label="${esc(it.title)}，点击阅读原文">
    <div class="ctop">
      <div class="tags">
        <span class="tag">${it.kind === "alert" ? "事件提醒" : "晨报"}</span>
        <span class="tag ${u[1]}">${u[0]}</span>
        ${hit ? `<span class="tag hit">命中 ${esc(it.hits.join(" · "))}</span>` : ""}
        ${isNew ? `<span class="tag new">新</span>` : ""}
      </div>
      <time class="time" title="${esc(fmtTime(it.publishedAt, true))}">${esc(relTime(it.publishedAt))}</time>
    </div>
    <h2>${highlight(it.title, terms)}</h2>
    <p class="${longText && !open ? "clamp" : ""}">${highlight(it.summary, terms)}</p>
    ${longText ? `<div class="expand-row"><button class="expand" type="button" data-expand="${esc(key)}">${open ? "收起" : "展开全文"}</button></div>` : ""}
    ${it.impact ? `<div class="impact"><b>影响分析　</b>${highlight(it.impact, terms)}</div>` : ""}
    ${it.nextStep ? `<p class="next"><b>建议关注　</b>${highlight(it.nextStep, terms)}</p>` : ""}
    <div class="cfoot">
      <span class="src">${esc(it.source || "未标注来源")}</span>
      ${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">阅读原文 ↗</a>` : `<span class="src">无外链</span>`}
    </div>
  </article>`;
}

function matches(it) {
  const terms = [];
  if (S.kw) terms.push(S.kw);
  if (S.q) S.q.split(/\s+/).filter(Boolean).forEach((t) => terms.push(t));
  if (!terms.length) return true;
  const hay = [it.title, it.summary, it.impact, it.nextStep, it.source, (it.hits || []).join(" ")].join(" ").toLowerCase();
  return terms.every((t) => hay.includes(t.toLowerCase()));
}

function visible() {
  return DATA.items.filter((it) => {
    if (S.filter === "hit" && !(it.hits && it.hits.length)) return false;
    if (S.filter === "brief" && it.kind !== "brief") return false;
    if (S.filter === "alert" && it.kind !== "alert") return false;
    if (S.kw && !(it.hits || []).includes(S.kw)) return false;
    return matches(it);
  });
}

function render() {
  const list = visible();
  const terms = S.q ? S.q.split(/\s+/).filter(Boolean) : (S.kw ? [S.kw] : []);

  $("s-total").textContent = DATA.items.length;
  $("s-high").textContent = DATA.items.filter((i) => i.urgency === "high").length;
  $("s-hit").textContent = DATA.items.filter((i) => i.hits && i.hits.length).length;
  $("c-all").textContent = DATA.items.length;
  $("s-time").textContent = DATA.updatedAt ? fmtTime(DATA.updatedAt) : "—";

  feed.innerHTML = list.map((it) => renderCard({
    ...it,
    hits: it.hits && it.hits.length ? it.hits : (terms.length ? terms.filter((t) =>
      [it.title, it.summary, it.impact, it.nextStep].join(" ").toLowerCase().includes(t.toLowerCase())) : [])
  })).join("");

  const none = list.length === 0;
  feed.hidden = none;
  empty.hidden = !none;
  if (none) {
    $("empty-title").textContent = DATA.items.length === 0 ? "还没有内容" : "没有符合条件的条目";
    $("empty-text").textContent = DATA.items.length === 0
      ? "定时任务生成晨报后，这里会自动出现。"
      : "换个筛选条件或清空搜索试试。";
  }
}

function renderWatch() {
  const kws = DATA.keywords || [];
  const box = $("watch");
  if (!kws.length) { box.hidden = true; return; }
  box.hidden = false;
  box.querySelectorAll(".chip").forEach((n) => n.remove());
  kws.forEach((k) => {
    const n = DATA.items.filter((i) => (i.hits || []).includes(k)).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", String(S.kw === k));
    b.innerHTML = `${esc(k)}<b>${n}</b>`;
    b.onclick = () => { S.kw = S.kw === k ? null : k; renderWatch(); render(); };
    box.appendChild(b);
  });
}

/* 整卡点击 / 键盘可达 / 展开 */
feed.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-expand]");
  if (btn) {
    e.stopPropagation();
    const key = btn.dataset.expand;
    S.expanded.has(key) ? S.expanded.delete(key) : S.expanded.add(key);
    render();
    return;
  }
  if (e.target.closest("a")) return;
  const card = e.target.closest(".card");
  const url = card && card.dataset.url;
  if (url) window.open(url, "_blank", "noopener");
});
feed.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const card = e.target.closest(".card");
  if (!card || e.target.closest("a,button")) return;
  e.preventDefault();
  if (card.dataset.url) window.open(card.dataset.url, "_blank", "noopener");
});

/* 顶部滚动进度 */
addEventListener("scroll", () => {
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  $("progress").style.width = max > 0 ? `${(h.scrollTop / max) * 100}%` : "0";
}, { passive: true });

document.querySelectorAll(".tab").forEach((t) => {
  t.addEventListener("click", () => {
    S.filter = t.dataset.filter;
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === t)));
    render();
  });
});
$("q").addEventListener("input", (e) => { S.q = e.target.value.trim(); render(); });

$("foot-date").textContent = DATA.generatedAt ? `生成于 ${fmtTime(DATA.generatedAt, true)}` : "";
$("subtitle").textContent = DATA.tagline || "重要的事，清楚地摆在眼前。";

/* 任何未捕获的脚本错误都显示出来，别再让它静默变成"0 条" */
addEventListener("error", (e) => {
  const box = $("empty");
  if (!box) return;
  box.hidden = false;
  $("empty-title").textContent = "页面出错了";
  $("empty-text").textContent = String(e.message || e.error || "未知错误");
});

renderWatch();
render();
store.set(LAST_KEY, String(Date.now()));

/* 部署到 http 上时，每 60 秒拉一次 briefing.json 做增量刷新 */
if (location.protocol.startsWith("http")) {
  setInterval(async () => {
    try {
      const r = await fetch("briefing.json?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      const next = await r.json();
      if (next.updatedAt !== DATA.updatedAt) {
        DATA.updatedAt = next.updatedAt; DATA.items = next.items; DATA.keywords = next.keywords || DATA.keywords;
        renderWatch(); render();
      }
      $("status").classList.remove("off"); $("status-text").textContent = "已同步";
    } catch {
      $("status").classList.add("off"); $("status-text").textContent = "离线 · 显示上次内容";
    }
  }, 60000);
}
</script>
</body>
</html>
